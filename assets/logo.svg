<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f051d"/>
      <stop offset="100%" stop-color="#1f0a2e"/>
    </linearGradient>
    <linearGradient id="shortsRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF0044"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#7000FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="100" fill="url(#bg)"/>
  <rect x="25" y="25" width="450" height="450" rx="85" fill="none" stroke="#2d123d" stroke-width="3"/>
  <!-- Phone Frame (9:16 Aspect) -->
  <rect x="155" y="80" width="190" height="340" rx="36" fill="#130821" stroke="#3b1654" stroke-width="6"/>
  <!-- Notch/Speaker -->
  <line x1="225" y1="105" x2="275" y2="105" stroke="#4a1e6d" stroke-width="5" stroke-linecap="round"/>
  <!-- Vibrant Shorts S Play Emblem -->
  <rect x="175" y="130" width="150" height="230" rx="24" fill="url(#shortsRed)" filter="url(#glow)"/>
  <!-- Inner Play Polygon -->
  <polygon points="230,205 285,245 230,285" fill="#FFFFFF"/>
  <!-- Audio wave burst accents -->
  <path d="M 370 210 Q 395 245, 370 280" fill="none" stroke="url(#neonCyan)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 395 185 Q 430 245, 395 305" fill="none" stroke="url(#neonCyan)" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
</svg>
